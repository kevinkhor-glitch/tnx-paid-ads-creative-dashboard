<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teleport Next Day - Creative Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;--white:#fff;--blue:#152CFF;--atmos:#1581FF;--midnight:#050B40;--dawn:#CCD6FF;--gray:#A4A4A4;
  --line:#E4E6F0;--muted:#5B6075;--bg:#F6F7FB;
  --font:'Poppins','Noto Sans Thai','Noto Sans SC',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--black);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:var(--blue)}
button,input,select{font-family:inherit;font-size:13px}
header{background:var(--black);color:var(--white);padding:22px 32px 0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
h1{font-weight:500;font-size:26px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--blue);background:var(--white);padding:0 8px;margin-left:8px;font-size:14px;vertical-align:middle;font-weight:600}
.sync{color:var(--gray);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);margin-top:20px;border-top:2px solid #3A3D4A;border-bottom:2px solid #3A3D4A}
.kpi{padding:18px 24px 20px;border-right:2px solid #3A3D4A}
.kpi:first-child{padding-left:0}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-size:30px;font-weight:500;line-height:1.2}
.kpi small{color:var(--gray);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tabs{display:flex;gap:0;margin-top:4px}
.tab{background:transparent;border:0;color:var(--gray);padding:14px 36px;min-width:170px;cursor:pointer;border-bottom:4px solid transparent;font-weight:500;font-size:14px}
.tab:hover{color:var(--white)}
.tab.on{color:var(--white);border-bottom-color:var(--blue)}
.filters{position:sticky;top:0;z-index:5;background:var(--white);border-bottom:2px solid var(--line);padding:14px 32px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters input[type=search]{flex:1 1 260px;min-width:220px;padding:9px 12px;border:1px solid var(--line);outline:none}
.filters input[type=search]:focus{border-color:var(--blue)}
.filters select{padding:8px 10px;border:1px solid var(--line);background:var(--white);max-width:220px}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--white);padding:7px 12px;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--white)}
.reset{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:500}
.count{margin-left:auto;color:var(--muted);font-size:12px}
main{padding:22px 32px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(600px,1fr));gap:16px}
.card{background:var(--white);border:1px solid var(--line);display:grid;grid-template-columns:260px 1fr;min-height:340px}
.visual{background:var(--midnight);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.visual.lowres img{image-rendering:auto;filter:saturate(1.05)}
.visual .fmt{position:absolute;left:0;top:0;background:var(--blue);color:var(--white);font-size:10px;padding:3px 8px;text-transform:uppercase;letter-spacing:.06em;z-index:2}
.visual .play{position:absolute;z-index:2;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;text-decoration:none}
.visual .play::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.visual .drivelink{position:absolute;left:0;right:0;bottom:0;z-index:3;background:rgba(5,11,64,.88);color:#fff;text-align:center;padding:9px 8px;font-size:12px;font-weight:500;text-decoration:none}
.visual .drivelink:hover{background:var(--blue)}
.foot a.nlink{color:var(--black)}
.foot .missing{color:var(--gray);font-size:11px}
.visual .none{color:var(--dawn);font-size:12px;text-align:center;padding:12px}
.details{display:flex;flex-direction:column;min-width:0}
.meta{padding:14px 16px;border-bottom:1px solid var(--line)}
.code{font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:10px;font-weight:600;padding:2px 7px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);color:var(--muted)}
.pill.active{background:#E8ECFF;border-color:var(--blue);color:var(--blue)}
.pill.plat{background:var(--black);color:var(--white);border-color:var(--black)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{font-size:11px;background:var(--bg);padding:2px 6px;color:var(--midnight)}
.angle{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-word}
.body{padding:12px 16px;flex:1}
.hl{font-weight:600;margin:0 0 6px}
.txt{white-space:pre-wrap;color:#222;font-size:13px;max-height:9em;overflow:hidden;position:relative}
.txt.open{max-height:none}
.more{border:0;background:none;color:var(--blue);padding:4px 0 0;cursor:pointer;font-weight:500;font-size:12px}
.foot{display:flex;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap;align-items:center}
.foot a{text-decoration:none;font-weight:500}
.foot .date{margin-left:auto;color:var(--muted)}
.loadmore{display:block;margin:24px auto 0;padding:10px 24px;background:var(--black);color:var(--white);border:0;cursor:pointer;font-weight:500}
.empty{padding:60px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12.5px}
th{background:var(--black);color:var(--white);font-weight:500;position:sticky;top:0}
td.n{word-break:break-all;color:var(--muted);max-width:520px}
.issuebar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.note{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--blue);padding:16px 18px;max-width:760px}
.tl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:12px}
.tl-head h2{font-weight:500;font-size:20px;margin:0}
.sub{color:var(--muted);font-size:12px;margin:2px 0 0}
.tl-chart{background:var(--white);border:1px solid var(--line);padding:18px 18px 8px;position:relative;margin-bottom:22px}
.tl-bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:end;column-gap:2px;height:170px;border-bottom:1px solid var(--line)}
.tl-bar{display:flex;align-items:flex-end;height:100%;cursor:pointer}
.tl-bar i{display:block;width:100%;background:var(--blue);border-radius:4px 4px 0 0;min-height:0}
.tl-bar:hover i{background:var(--atmos)}
.tl-bar.empty{cursor:default}
.tl-axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding-top:6px}
.tl-tip{position:absolute;pointer-events:none;background:var(--black);color:var(--white);font-size:12px;padding:6px 9px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:4}
.tl-group{margin-bottom:18px}
.tl-date{font-weight:600;font-size:13px;padding:8px 0;border-bottom:2px solid var(--black);display:flex;justify-content:space-between;position:sticky;top:var(--fh,64px);background:var(--bg);z-index:2}
.tl-date span{color:var(--muted);font-weight:500}
.tl-row{display:grid;grid-template-columns:56px 64px 110px 1fr 150px 70px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.tl-row img,.tl-row .noimg{width:56px;height:56px;object-fit:cover;background:var(--midnight);display:block}
.tl-row .t{color:var(--muted);font-variant-numeric:tabular-nums}
.tl-row .c{font-weight:600}
.tl-row .a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-row .lk a{margin-right:8px;text-decoration:none;font-weight:500}
.launch{color:var(--muted);font-size:12px;margin-top:6px}
.launch b{color:var(--black);font-weight:600}
.totop{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);z-index:20;background:var(--black);color:var(--white);border:2px solid var(--blue);padding:11px 22px;font-weight:500;font-size:13px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 18px rgba(5,11,64,.25)}
.totop.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.totop:hover{background:var(--blue)}
.hidden{display:none!important}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(3){border-right:0}.kpi:nth-child(4){padding-left:0}}
@media (max-width:700px){header,main,.filters{padding-left:16px;padding-right:16px}.kpi{padding-right:14px;margin-right:14px}.grid{grid-template-columns:1fr}.card{grid-template-columns:1fr}.visual{height:300px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>Teleport Next Day - Creative Library<span>Meta + TikTok</span></h1></div>
    <div class="sync" id="sync"></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <nav class="tabs">
    <button class="tab on" data-view="ads">Creatives</button>
    <button class="tab" data-view="timeline">Timeline</button>
    <button class="tab" data-view="issues">Name issues</button>
    <button class="tab" data-view="perf">Performance</button>
  </nav>
</header>

<section class="filters" id="filters">
  <input type="search" id="q" placeholder="Search CR code, angle, batch, copy, ad name…">
  <div class="chips" id="platChips"></div>
  <select id="fStatus"></select>
  <select id="fGroup"></select>
  <select id="fMarket"></select>
  <select id="fTheme"></select>
  <select id="fFormat"></select>
  <select id="fBatch"></select>
  <select id="fLinks"><option value="">Links: all</option><option value="has">Has Notion/Drive</option><option value="missing">Missing links</option></select>
  <select id="fSort">
    <option value="new">Newest first</option>
    <option value="old">Oldest first</option>
    <option value="cr">CR code</option>
  </select>
  <button class="reset" id="reset">Reset</button>
  <span class="count" id="count"></span>
</section>

<main>
  <div id="viewAds"><div class="grid" id="grid"></div><button class="loadmore hidden" id="more">Show more</button></div>
  <div id="viewTimeline" class="hidden">
    <div class="tl-head"><div><h2>Launch timeline</h2><p class="sub" id="tlSub"></p></div>
      <div class="chips" id="tlScale"><button class="chip on" data-s="week">Weekly</button><button class="chip" data-s="month">Monthly</button></div></div>
    <div class="tl-chart" id="tlChart"></div>
    <div id="tlList"></div>
  </div>
  <div id="viewIssues" class="hidden"><div class="issuebar" id="issueChips"></div><table><thead><tr><th>Issue</th><th>Platform</th><th>Ad name</th><th>Detail</th></tr></thead><tbody id="issueRows"></tbody></table></div>
  <div id="viewPerf" class="hidden"><div class="note"><b>Performance is coming next.</b><br>Spend, leads, cost per lead, clicks and CPM will be pulled from Meta Ads per ad and shown here and on each card.</div></div>
</main>
<button class="totop" id="totop" aria-label="Back to top">↑ Back to top</button>

<script>
const PAGE = 60;
const PLAT = {fb:'Facebook', ig:'Instagram', tt:'TikTok'};
let DATA = {ads:[], issues:[]}, shown = PAGE, plat = new Set(), issueFilter = '', view = 'ads', tlScale = 'week', tlOpened = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq = (arr) => [...new Set(arr.filter(Boolean))].sort();
const isActive = a => a.st === 'Active';
const mkt = a => a.lg ? `${a.mk}-${a.lg}` : a.mk;

function fillSelect(el, label, values){
  el.innerHTML = `<option value="">${label}: all</option>` + values.map(v => `<option>${esc(v)}</option>`).join('');
}

function init(){
  const A = DATA.ads;
  $('sync').textContent = 'Last synced ' + DATA.synced;
  const campaigns = new Set(A.map(a => a.cid)).size;
  const activeCamps = new Set(A.filter(isActive).map(a => a.cid)).size;
  $('kpis').innerHTML = [
    [A.length, 'Ads'], [A.filter(isActive).length, 'Active ads'], [campaigns, 'Campaigns'],
    [activeCamps, 'Active campaigns'], [new Set(DATA.issues.map(i => i.id)).size, 'Ads with name issues']
  ].map(([n, l]) => `<div class="kpi"><b>${n.toLocaleString()}</b><small>${l}</small></div>`).join('');
  $('platChips').innerHTML = ['fb','ig','tt'].map(p => `<button class="chip" data-p="${p}">${PLAT[p]}</button>`).join('');
  fillSelect($('fStatus'), 'Status', ['Active', 'Not active']);
  fillSelect($('fGroup'), 'Group', uniq(A.map(a => a.g)));
  fillSelect($('fMarket'), 'Market', uniq(A.map(mkt)));
  fillSelect($('fTheme'), 'Theme', uniq(A.map(a => a.th)));
  fillSelect($('fFormat'), 'Format', uniq(A.map(a => a.f)));
  fillSelect($('fBatch'), 'Batch', uniq(A.map(a => a.b)));
  $('fStatus').value = 'Active';
  bind(); render(); renderIssues();
}

function bind(){
  $('platChips').onclick = e => { const p = e.target.dataset.p; if(!p) return;
    plat.has(p) ? plat.delete(p) : plat.add(p); e.target.classList.toggle('on'); shown = PAGE; render(); };
  ['q','fStatus','fGroup','fMarket','fTheme','fFormat','fBatch','fLinks','fSort'].forEach(id =>
    $(id).addEventListener(id === 'q' ? 'input' : 'change', () => { shown = PAGE; render(); }));
  $('reset').onclick = () => { ['q','fStatus','fGroup','fMarket','fTheme','fFormat','fBatch','fLinks'].forEach(id => $(id).value = '');
    $('fSort').value = 'new'; plat.clear(); document.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); shown = PAGE; render(); };
  $('more').onclick = () => { shown += PAGE; render(); };
  $('tlScale').onclick = e => { const v = e.target.dataset.s; if(!v) return; tlScale = v;
    document.querySelectorAll('#tlScale .chip').forEach(c => c.classList.toggle('on', c === e.target)); render(); };
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    const v = t.dataset.view;
    $('viewAds').classList.toggle('hidden', v !== 'ads');
    $('viewIssues').classList.toggle('hidden', v !== 'issues');
    $('viewPerf').classList.toggle('hidden', v !== 'perf');
    $('viewTimeline').classList.toggle('hidden', v !== 'timeline');
    $('filters').classList.toggle('hidden', v !== 'ads' && v !== 'timeline');
    if(v === 'timeline' && !tlOpened){ $('fStatus').value = ''; tlOpened = true; }
    $('fSort').classList.toggle('hidden', v === 'timeline');
    view = v; render();
  });
  $('grid').addEventListener('click', e => { if(e.target.classList.contains('more')){
    const t = e.target.previousElementSibling; t.classList.toggle('open');
    e.target.textContent = t.classList.contains('open') ? 'Show less' : 'Show full copy'; }});
}

function filtered(){
  const q = $('q').value.trim().toLowerCase(), st = $('fStatus').value, g = $('fGroup').value, m = $('fMarket').value,
        th = $('fTheme').value, f = $('fFormat').value, b = $('fBatch').value, lk = $('fLinks').value;
  let r = DATA.ads.filter(a =>
    (!plat.size || plat.has(a.p)) &&
    (!st || (st === 'Active') === isActive(a)) &&
    (!lk || (lk === 'has') === !!(a.nl || a.dl)) && (!g || a.g === g) && (!m || mkt(a) === m) && (!th || a.th === th) && (!f || a.f === f) && (!b || a.b === b) &&
    (!q || [a.c, a.an, a.hk, a.b, a.h, a.t, a.n, a.th, a.fw].join(' ').toLowerCase().includes(q)));
  const s = $('fSort').value;
  const crNum = c => { const m = /CR(\d+)(?:_(\d+))?/.exec(c || ''); return m ? (+m[1]) * 1000 + (+(m[2] || 0)) : 1e9; };
  r.sort(s === 'old' ? (x, y) => x.cr.localeCompare(y.cr) : s === 'cr' ? (x, y) => crNum(x.c) - crNum(y.c) : (x, y) => y.cr.localeCompare(x.cr));
  return r;
}

function visual(a){
  const label = `<span class="fmt">${esc(a.v ? 'video' : (a.f || a.ct || ''))}</span>`;
  const play = a.vu ? `<a class="play" href="${esc(a.vu)}" target="_blank" rel="noopener" title="Watch video"></a>` : '';
  const drive = a.dl ? `<a class="drivelink" href="${esc(a.dl)}" target="_blank" rel="noopener" title="Open final output in Google Drive">Open in Drive ↗</a>` : '';
  if(!a.img) return `<div class="visual">${label}<div class="none">${a.p === 'tt' ? 'TikTok Smart+<br>preview not available' : 'No preview'}</div>${drive}</div>`;
  const low = a.lr ? ' lowres' : '';
  return `<div class="visual${a.v ? ' video' : ''}${low}">${label}<img loading="lazy" src="${esc(a.img)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'none',innerHTML:'No preview'}))">${play}${drive}</div>`;
}

function card(a){
  const tags = [mkt(a), a.g, a.th, a.de, a.b].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const angle = [a.fw, a.hk, a.an].filter(Boolean).join(' · ');
  const files = a.files ? `<div class="angle">Videos: ${esc(a.files.split('\n').length)}</div>` : '';
  return `<article class="card">
    ${visual(a)}
    <div class="details">
      <div class="meta">
        <div class="code">${esc(a.c || 'No CR code')}<span class="pill plat">${a.p}</span><span class="pill ${isActive(a) ? 'active' : ''}">${esc(a.st)}</span></div>
        <div class="tags">${tags}</div>
        ${angle ? `<div class="angle">${esc(angle)}</div>` : ''}${files}
        <div class="launch" title="When the ad was created in Ads Manager (Malaysia time)">Launched <b>${fmtTs(a.ts)}</b></div>
      </div>
      <div class="body">
        ${a.h ? `<p class="hl">${esc(a.h)}</p>` : ''}
        <div class="txt">${esc(a.t || '(no copy returned)')}</div>
        ${(a.t || '').length > 220 ? '<button class="more">Show full copy</button>' : ''}
      </div>
      <div class="foot">
        ${a.nl ? `<a class="nlink" href="${esc(a.nl)}" target="_blank" rel="noopener">Notion brief</a>` : ''}
        ${a.dl ? `<a href="${esc(a.dl)}" target="_blank" rel="noopener">Drive folder</a>` : ''}
        ${!a.nl && !a.dl ? '<span class="missing">No Notion / Drive link yet</span>' : ''}
        ${a.am ? `<a href="${esc(a.am)}" target="_blank" rel="noopener">Ads Manager</a>` : ''}
        ${a.vu ? `<a href="${esc(a.vu)}" target="_blank" rel="noopener">Watch video</a>` : ''}
        ${a.url && /^https?:/.test(a.url) && !/fb\.me\/?$/.test(a.url) ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">Landing page</a>` : ''}
        ${a.cta ? `<span class="pill">${esc(a.cta.replace(/_/g, ' '))}</span>` : ''}
        <span class="date" title="${esc(a.n)}">${esc(a.id)}</span>
      </div>
    </div>
  </article>`;
}

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){ const [y,m,dd] = d.split('-'); return `${+dd} ${MON[+m-1]} ${y}`; }
function fmtTs(ts){ if(!ts) return ''; const [d,t] = ts.split(' '); return `${fmtDate(d)}, ${t}`; }
function weekStart(d){ const x = new Date(d + 'T00:00:00Z'); const k = (x.getUTCDay() + 6) % 7; x.setUTCDate(x.getUTCDate() - k); return x.toISOString().slice(0,10); }
function bucket(d){ return tlScale === 'week' ? weekStart(d) : d.slice(0,7) + '-01'; }
function nextBucket(b){ const x = new Date(b + 'T00:00:00Z'); if(tlScale === 'week') x.setUTCDate(x.getUTCDate() + 7); else x.setUTCMonth(x.getUTCMonth() + 1); return x.toISOString().slice(0,10); }
function bucketLabel(b){ if(tlScale === 'month'){ const [y,m] = b.split('-'); return `${MON[+m-1]} ${y}`; } return 'Week of ' + fmtDate(b); }

function renderTimeline(r){
  if(!r.length){ $('tlChart').innerHTML = '<div class="empty">No ads match these filters.</div>'; $('tlList').innerHTML = ''; $('tlSub').textContent = ''; return; }
  const counts = {}; r.forEach(a => { const b = bucket(a.cr); counts[b] = (counts[b] || 0) + 1; });
  const keys = Object.keys(counts).sort(); const all = [];
  for(let b = keys[0]; b <= keys[keys.length - 1]; b = nextBucket(b)) all.push(b);
  const max = Math.max(...Object.values(counts));
  $('tlSub').textContent = `${r.length.toLocaleString()} ads launched between ${fmtDate(r.map(a=>a.cr).sort()[0])} and ${fmtDate(r.map(a=>a.cr).sort().pop())}. Click a bar to jump to it.`;
  $('tlChart').innerHTML = `<div class="tl-tip" id="tlTip"></div><div class="tl-bars">${all.map(b => {
      const n = counts[b] || 0;
      return `<div class="tl-bar${n ? '' : ' empty'}" data-b="${b}" data-n="${n}"><i style="height:${n ? Math.max(2, n / max * 100) : 0}%"></i></div>`; }).join('')}</div>
    <div class="tl-axis"><span>${bucketLabel(all[0])}</span><span>${bucketLabel(all[all.length - 1])}</span></div>`;
  const tip = $('tlTip'), chart = $('tlChart');
  chart.querySelectorAll('.tl-bar').forEach(el => {
    el.onmouseenter = () => { const rc = el.getBoundingClientRect(), cc = chart.getBoundingClientRect();
      tip.textContent = `${bucketLabel(el.dataset.b)}: ${el.dataset.n} ad${el.dataset.n === '1' ? '' : 's'}`;
      tip.style.left = (rc.left - cc.left + rc.width / 2) + 'px'; tip.style.top = (rc.top - cc.top + rc.height - el.firstChild.offsetHeight) + 'px'; tip.style.display = 'block'; };
    el.onmouseleave = () => tip.style.display = 'none';
    el.onclick = () => { const t = document.getElementById('tl-' + el.dataset.b); if(t) t.scrollIntoView({behavior:'smooth', block:'start'}); };
  });
  const byDay = {}; [...r].sort((x, y) => y.ts.localeCompare(x.ts)).forEach(a => (byDay[a.cr] = byDay[a.cr] || []).push(a));
  const seenBucket = new Set();
  $('tlList').innerHTML = Object.keys(byDay).sort().reverse().map(d => {
    const b = bucket(d); const anchor = seenBucket.has(b) ? '' : ` id="tl-${b}"`; seenBucket.add(b);
    const rows = byDay[d].map(a => `<div class="tl-row">
        ${a.img ? `<img loading="lazy" src="${esc(a.img)}" alt="">` : '<div class="noimg"></div>'}
        <span class="t">${esc(a.ts.split(' ')[1])}</span>
        <span class="c">${esc(a.c || '—')} <span class="pill plat">${a.p}</span></span>
        <span class="a" title="${esc(a.n)}">${esc([mkt(a), a.g, a.th, a.an].filter(Boolean).join(' · '))}</span>
        <span class="lk">${a.nl ? `<a href="${esc(a.nl)}" target="_blank" rel="noopener">Notion</a>` : ''}${a.dl ? `<a href="${esc(a.dl)}" target="_blank" rel="noopener">Drive</a>` : ''}${a.am ? `<a href="${esc(a.am)}" target="_blank" rel="noopener">Ad</a>` : ''}</span>
        <span class="pill ${isActive(a) ? 'active' : ''}">${esc(a.st)}</span>
      </div>`).join('');
    return `<section class="tl-group"${anchor}><div class="tl-date">${fmtDate(d)}<span>${byDay[d].length} ad${byDay[d].length === 1 ? '' : 's'}</span></div>${rows}</section>`;
  }).join('');
}

function render(){
  if(typeof setFh === 'function') requestAnimationFrame(setFh);
  if(view === 'timeline'){ const r = filtered(); $('count').textContent = `${r.length.toLocaleString()} ads`; renderTimeline(r); return; }
  const r = filtered();
  $('count').textContent = `${r.length.toLocaleString()} ads`;
  $('grid').innerHTML = r.length ? r.slice(0, shown).map(card).join('') : '<div class="empty">No ads match these filters.</div>';
  $('more').classList.toggle('hidden', r.length <= shown);
}

function renderIssues(){
  const counts = {};
  DATA.issues.forEach(i => counts[i.issue] = (counts[i.issue] || 0) + 1);
  $('issueChips').innerHTML = `<button class="chip on" data-i="">All (${DATA.issues.length})</button>` +
    Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<button class="chip" data-i="${esc(k)}">${esc(k)} (${v})</button>`).join('');
  $('issueChips').onclick = e => { if(e.target.dataset.i === undefined) return; issueFilter = e.target.dataset.i;
    document.querySelectorAll('#issueChips .chip').forEach(c => c.classList.toggle('on', c === e.target)); drawIssues(); };
  drawIssues();
}
function drawIssues(){
  $('issueRows').innerHTML = DATA.issues.filter(i => !issueFilter || i.issue === issueFilter)
    .map(i => `<tr><td>${esc(i.issue)}</td><td>${esc(i.p)}</td><td class="n">${esc(i.n)}</td><td>${esc(i.detail)}</td></tr>`).join('');
}

const setFh = () => document.documentElement.style.setProperty('--fh', $('filters').offsetHeight + 'px');
window.addEventListener('resize', setFh); setTimeout(setFh, 0);
window.addEventListener('scroll', () => $('totop').classList.toggle('show', window.scrollY > 900), {passive: true});
$('totop').onclick = () => window.scrollTo({top: 0, behavior: 'smooth'});

fetch('data/ads.json', {cache: 'no-store'}).then(r => r.json()).then(d => { DATA = d; init(); })
  .catch(() => { $('grid').innerHTML = '<div class="empty">Could not load data/ads.json.</div>'; });
</script>
</body>
</html>
